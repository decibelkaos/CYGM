<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYGM - Settings</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Device Settings</h1>
            <p class="subtitle">Configure WiFi, Time, Weather, and CGM</p>
        </div>
    </header>

    <nav>
        <div class="container">
            <ul>
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="settings.html">Settings</a></li>
                <li><a href="developer.html">Developer Tools</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <!-- Tabs -->
            <div class="tabs">
                <button class="tab" data-tab="tab-wifi">WiFi</button>
                <button class="tab" data-tab="tab-time">Time & Date</button>
                <button class="tab" data-tab="tab-weather">Weather</button>
                <button class="tab" data-tab="tab-cgm">CGM</button>
            </div>

            <!-- WiFi Tab -->
            <div id="tab-wifi" class="tab-content">
                <h2>WiFi Configuration</h2>
                <div class="form-group">
                    <label>Current Status</label>
                    <span id="wifi-status" class="status status-disconnected">Disconnected</span>
                </div>

                <div class="form-group">
                    <label for="wifi-ssid">Network (SSID)</label>
                    <select id="wifi-scan-list" onchange="selectNetwork()">
                        <option value="">-- Select or type manually --</option>
                    </select>
                    <input type="text" id="wifi-ssid" placeholder="Enter SSID">
                </div>

                <div class="form-group">
                    <label for="wifi-password">Password</label>
                    <input type="password" id="wifi-password" placeholder="Enter password">
                </div>

                <button class="btn btn-secondary" onclick="scanNetworks()">Scan Networks</button>
                <button class="btn btn-primary" onclick="saveWiFi()">Connect</button>
            </div>

            <!-- Time Tab -->
            <div id="tab-time" class="tab-content">
                <h2>Time & Date Configuration</h2>
                <div class="form-group">
                    <label for="timezone">Timezone</label>
                    <select id="timezone">
                        <option value="America/New_York">Eastern (America/New_York)</option>
                        <option value="America/Chicago">Central (America/Chicago)</option>
                        <option value="America/Denver">Mountain (America/Denver)</option>
                        <option value="America/Los_Angeles">Pacific (America/Los_Angeles)</option>
                        <option value="America/Phoenix">Arizona (America/Phoenix)</option>
                        <option value="America/Anchorage">Alaska (America/Anchorage)</option>
                        <option value="Pacific/Honolulu">Hawaii (Pacific/Honolulu)</option>
                        <option value="Europe/London">London (Europe/London)</option>
                        <option value="Europe/Paris">Paris (Europe/Paris)</option>
                        <option value="Asia/Tokyo">Tokyo (Asia/Tokyo)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" id="dst-enabled"> Enable Daylight Saving Time
                    </label>
                </div>

                <div class="form-group">
                    <label>Time Format</label>
                    <div>
                        <label style="display: inline-block; margin-right: 20px;">
                            <input type="radio" name="time-format" value="12" checked> 12-hour
                        </label>
                        <label style="display: inline-block;">
                            <input type="radio" name="time-format" value="24"> 24-hour
                        </label>
                    </div>
                </div>

                <div class="alert alert-info">
                    <strong>Current Time:</strong> <span id="current-time">--</span>
                </div>

                <button class="btn btn-primary" onclick="saveTime()">Save Time Settings</button>
            </div>

            <!-- Weather Tab -->
            <div id="tab-weather" class="tab-content">
                <h2>Weather Configuration</h2>
                <div class="form-group">
                    <label for="zipcode">Zipcode</label>
                    <input type="text" id="zipcode" placeholder="Enter zipcode (e.g., 10001)">
                </div>

                <div class="form-group">
                    <label>Temperature Unit</label>
                    <div>
                        <label style="display: inline-block; margin-right: 20px;">
                            <input type="radio" name="temp-unit" value="F" checked> Fahrenheit (°F)
                        </label>
                        <label style="display: inline-block;">
                            <input type="radio" name="temp-unit" value="C"> Celsius (°C)
                        </label>
                    </div>
                </div>

                <div class="alert alert-info">
                    <strong>Current Weather:</strong> <span id="current-weather">--</span>
                </div>

                <button class="btn btn-primary" onclick="saveWeather()">Save Weather Settings</button>
            </div>

            <!-- CGM Tab -->
            <div id="tab-cgm" class="tab-content">
                <h2>CGM Configuration</h2>
                <div class="form-group">
                    <label for="cgm-type">CGM Type</label>
                    <select id="cgm-type">
                        <option value="dexcom">Dexcom</option>
                        <option value="libre">Libre (Future)</option>
                        <option value="none">None</option>
                    </select>
                </div>

                <div id="dexcom-auth">
                    <h3>Dexcom Authentication</h3>
                    <div class="form-group">
                        <label>Status</label>
                        <span id="cgm-auth-status" class="status status-disconnected">Not Authenticated</span>
                    </div>

                    <div class="form-group">
                        <label for="dexcom-username">Username</label>
                        <input type="text" id="dexcom-username" placeholder="Enter Dexcom username">
                    </div>

                    <div class="form-group">
                        <label for="dexcom-password">Password</label>
                        <input type="password" id="dexcom-password" placeholder="Enter Dexcom password">
                    </div>

                    <button class="btn btn-primary" onclick="loginDexcom()">Login</button>
                    <button class="btn btn-danger" onclick="logoutCGM()">Logout</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/settings.js"></script>
</body>
</html>
